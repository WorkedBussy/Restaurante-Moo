<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Entregas & Comandas | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm border-bottom border-warning">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-bicycle text-warning me-2"></i>Panel de Entregas & Salón
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="badge bg-warning text-dark px-3 py-2 fw-bold" id="badge-nombre-personal">Personal</span>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Comandas en Atención & Despacho</h3>
        <p class="text-muted small mb-0">Confirma la entrega de órdenes y actualiza los tiempos de espera a los comensales</p>
      </div>
      <button class="btn btn-outline-dark btn-sm" onclick="cargarEntregas()"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
    </div>

    <div class="row g-4" id="contenedor-entregas">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-warning" role="status"></div>
        <p class="text-muted mt-2">Cargando comandas asignadas...</p>
      </div>
    </div>
  </main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // [IMPORTANTE: Solución Error 6 de la guía]
    // Incluir "administrador" para que el admin también pueda ver y auditar esta vista sin bucle
    protegerPagina(["repartidor", "mesero", "administrador"]);

    let personalActual = null;
    let listaPedidos = [];

    async function iniciarPagina(datosUsuario, user) {
      personalActual = { ...datosUsuario, uid: user.uid };
      const badge = document.getElementById("badge-nombre-personal");
      if (badge) badge.textContent = `${personalActual.nombre || 'Personal'} (${personalActual.rol || 'Staff'})`;

      await cargarEntregas();
      
      // Escuchar cambios en vivo
      db.collection("pedidos")
        .where("estado", "in", ["en_preparacion", "listo_para_servir", "en_camino"])
        .onSnapshot(() => {
          cargarEntregas();
        });
    }

    async function cargarEntregas() {
      const container = document.getElementById("contenedor-entregas");
      try {
        const snap = await db.collection("pedidos")
          .where("estado", "in", ["en_preparacion", "listo_para_servir", "en_camino"])
          .get();

        listaPedidos = [];
        snap.forEach(d => listaPedidos.push({ id: d.id, ...d.data() }));

        if (listaPedidos.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5 bg-white rounded-4 shadow-sm border p-5">
              <i class="bi bi-check2-circle text-success" style="font-size: 3.5rem;"></i>
              <h4 class="fw-bold mt-3">¡Todo al día!</h4>
              <p class="text-muted col-md-6 mx-auto mb-0">No hay comandas pendientes de entrega en este momento.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = listaPedidos.map(p => {
          const itemsTxt = (p.detalles || []).map(d => `${d.cantidad}x ${d.nombre_producto}`).join(", ");
          const esCobroEfectivo = p.forma_pago === "efectivo";

          return `
            <div class="col-md-6 col-lg-4">
              <div class="card border-0 shadow-sm rounded-4 h-100 bg-white">
                <div class="card-header bg-white py-3 px-3 d-flex justify-content-between align-items-center border-bottom">
                  <div>
                    <span class="fw-bold">Comanda #${p.id.slice(0, 6).toUpperCase()}</span>
                    <small class="text-muted d-block">${p.cliente_nombre}</small>
                  </div>
                  <span class="badge-estado badge-${p.estado}">${p.estado.replace(/_/g, " ")}</span>
                </div>

                <div class="card-body p-3">
                  <div class="p-2 mb-3 bg-light rounded-3 small">
                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><strong>Ubicación:</strong> ${p.mesa_o_direccion} (${p.tipo_servicio})<br>
                    <i class="bi bi-wallet2 text-primary me-1"></i><strong>Pago:</strong> 
                    ${esCobroEfectivo ? '<span class="text-danger fw-bold">COBRAR EN EFECTIVO $' + p.total.toFixed(2) + '</span>' : '<span class="text-success fw-bold">PAGADO (Transferencia / Tarjeta)</span>'}
                  </div>

                  <p class="mb-1 text-muted small fw-semibold">Platillos a Entregar:</p>
                  <p class="mb-3 small fw-medium text-dark">${itemsTxt}</p>

                  <!-- ACTUALIZACIÓN DE TIEMPO ESTIMADO -->
                  <div class="mb-3">
                    <label class="form-label small fw-bold text-muted mb-1">Notificar Tiempo Estimado:</label>
                    <div class="btn-group btn-group-sm w-100" role="group">
                      <button type="button" class="btn btn-outline-secondary" onclick="marcarTiempo('${p.id}', 5)">5m</button>
                      <button type="button" class="btn btn-outline-secondary" onclick="marcarTiempo('${p.id}', 10)">10m</button>
                      <button type="button" class="btn btn-outline-secondary" onclick="marcarTiempo('${p.id}', 15)">15m</button>
                      <button type="button" class="btn btn-outline-secondary" onclick="marcarTiempo('${p.id}', 25)">25m</button>
                    </div>
                  </div>
                </div>

                <div class="card-footer bg-light p-3 border-top">
                  <button class="btn btn-success w-100 py-2 fw-bold" onclick="marcarComoEntregado('${p.id}')">
                    <i class="bi bi-check-circle-fill me-1"></i>Confirmar Entrega
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Error al cargar entregas:", err);
      }
    }

    async function marcarTiempo(pedidoId, min) {
      try {
        await actualizarTiempoEstimado(pedidoId, min);
        mostrarToast(`Tiempo estimado actualizado a ${min} minutos`, "info");
      } catch (err) {
        mostrarToast(err.message, "error");
      }
    }

    async function marcarComoEntregado(pedidoId) {
      const pedido = listaPedidos.find(p => p.id === pedidoId);
      if (!pedido) return;

      if (!confirm(`¿Confirmas la entrega de la comanda #${pedidoId.slice(0, 6).toUpperCase()}?`)) return;

      try {
        // [PATRÓN STATE]
        // Transición hacia estado 'entregado'
        await cambiarEstadoPedido(pedidoId, pedido, "entregado", personalActual.uid, `Entregado por ${personalActual.nombre || 'Personal'}`);
        mostrarToast("¡Comanda marcada como ENTREGADA exitosamente!", "success");
        await cargarEntregas();
      } catch (err) {
        mostrarToast(err.message, "error");
      }
    }
  </script>
</body>
</html>
