<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú & Carta Digital | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-fire text-danger me-2"></i>Sabor <span>& Fuego</span>
      </a>
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalogo.html">Menú & Carta</a></li>
          <li class="nav-item"><a class="nav-link" href="mis-pedidos.html">Mis Pedidos</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3" id="navbar-usuario-slot">
          <a href="carrito.html" class="btn btn-outline-light position-relative">
            <i class="bi bi-cart3"></i>
            <span id="cart-counter" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
          </a>
          <a href="login.html" class="btn btn-outline-light btn-sm">Iniciar Sesión</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- CABECERA DEL MENÚ -->
  <div class="bg-white border-bottom py-4 mb-4 shadow-sm">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-md-6">
          <h2 class="fw-bold mb-1">Nuestra Carta Gourmet</h2>
          <p class="text-muted small mb-0">Selecciona tus platillos favoritos y realiza tu orden en minutos</p>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="busqueda-input" class="form-control border-start-0 bg-light" placeholder="Buscar por plato, corte o ingredientes..." oninput="filtrarPlatos()">
          </div>
        </div>
      </div>

      <!-- FILTRO DE CATEGORÍAS -->
      <div class="d-flex gap-2 overflow-auto pt-3 pb-1" id="categorias-filtros-container">
        <button class="btn btn-sm btn-dark rounded-pill px-3 active" onclick="seleccionarCategoria(null, this)">Todos</button>
        <!-- Categorías dinámicas -->
      </div>
    </div>
  </div>

  <!-- CONTENEDOR DE PLATOS -->
  <main class="container pb-5">
    <div class="row g-4" id="platos-grid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="text-muted mt-2">Cargando exquisito menú...</p>
      </div>
    </div>
  </main>

  <!-- BARRA FLOTANTE DE COMANDA (APARECE CUANDO HAY ITEMS) -->
  <div id="floating-cart-bar" class="position-fixed bottom-0 start-50 translate-middle-x mb-4 shadow-lg p-3 bg-dark text-white rounded-pill d-none align-items-center justify-content-between" style="width: 90%; max-width: 500px; z-index: 1050;">
    <div class="d-flex align-items-center ms-3">
      <i class="bi bi-basket text-danger fs-4 me-2"></i>
      <div>
        <span id="floating-cart-items" class="fw-bold">0 platillos</span>
        <span class="text-muted small d-block">Total: <strong id="floating-cart-total" class="text-white">$0.00</strong></span>
      </div>
    </div>
    <a href="carrito.html" class="btn btn-primary-custom rounded-pill px-4">Ver Pedido <i class="bi bi-arrow-right ms-1"></i></a>
  </div>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // [PILAR MOO: POLIMORFISMO]
    protegerPagina([]); // El catálogo es accesible a clientes y visitantes

    let todosLosPlatos = [];
    let categoriaSeleccionada = null;

    // [POLIMORFISMO: Invocado por protegerPagina]
    async function iniciarPagina(usuario) {
      actualizarBarraFlotante();
      await cargarCategorias();
      await cargarPlatos();
    }

    async function cargarCategorias() {
      const container = document.getElementById("categorias-filtros-container");
      try {
        const categorias = await listarCategorias();
        if (categorias.length > 0) {
          categorias.forEach(cat => {
            const btn = document.createElement("button");
            btn.className = "btn btn-sm btn-outline-dark rounded-pill px-3";
            btn.textContent = cat.nombre;
            btn.onclick = () => seleccionarCategoria(cat.id, btn);
            container.appendChild(btn);
          });
        }
      } catch (err) {
        console.error("Error cargando categorías:", err);
      }
    }

    async function cargarPlatos() {
      try {
        todosLosPlatos = await listarProductos(null, true);
        renderizarPlatos(todosLosPlatos);
      } catch (err) {
        console.error("Error al cargar platos:", err);
      }
    }

    function renderizarPlatos(lista) {
      const grid = document.getElementById("platos-grid");
      if (lista.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-egg-fried fs-1 text-muted"></i>
            <h5 class="mt-3 text-muted">No se encontraron platillos en esta sección</h5>
          </div>
        `;
        return;
      }

      grid.innerHTML = lista.map(p => {
        const sinStock = (p.stock_actual || 0) <= 0;
        return `
          <div class="col-md-6 col-lg-4 col-xl-3">
            <div class="dish-card ${sinStock ? 'opacity-75' : ''}">
              <div class="dish-img-wrapper">
                <img src="${p.imagen_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'}" class="dish-img" alt="${p.nombre}">
                <span class="dish-badge-time"><i class="bi bi-stopwatch me-1"></i>${p.tiempo_preparacion || 15}m</span>
                <span class="dish-badge-stock badge ${sinStock ? 'bg-danger' : 'bg-dark'}">
                  ${sinStock ? 'Agotado' : `Stock: ${p.stock_actual}`}
                </span>
              </div>
              <div class="dish-body">
                <span class="badge bg-light text-secondary align-self-start mb-2">${p.categoria_nombre || 'General'}</span>
                <h5 class="dish-title">${p.nombre}</h5>
                <p class="dish-desc">${p.descripcion || 'Preparado con ingredientes premium seleccionados por el chef.'}</p>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-2 border-top">
                  <span class="dish-price">$${p.precio.toFixed(2)}</span>
                  <button 
                    class="btn ${sinStock ? 'btn-secondary disabled' : 'btn-primary-custom'} btn-sm"
                    ${sinStock ? 'disabled' : ''}
                    onclick="agregarAlCarrito('${p.id}', '${p.nombre}', ${p.precio}, ${p.stock_actual})">
                    <i class="bi bi-cart-plus me-1"></i>${sinStock ? 'Sin Stock' : 'Agregar'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function seleccionarCategoria(catId, btnElement) {
      categoriaSeleccionada = catId;
      document.querySelectorAll("#categorias-filtros-container button").forEach(b => {
        b.className = "btn btn-sm btn-outline-dark rounded-pill px-3";
      });
      btnElement.className = "btn btn-sm btn-dark rounded-pill px-3 active";
      filtrarPlatos();
    }

    function filtrarPlatos() {
      const q = document.getElementById("busqueda-input").value.toLowerCase();
      let filtrados = todosLosPlatos;

      if (categoriaSeleccionada) {
        filtrados = filtrados.filter(p => p.categoria_id === categoriaSeleccionada);
      }
      if (q) {
        filtrados = filtrados.filter(p => 
          p.nombre.toLowerCase().includes(q) || 
          (p.descripcion && p.descripcion.toLowerCase().includes(q))
        );
      }
      renderizarPlatos(filtrados);
    }

    function agregarAlCarrito(id, nombre, precio, stockMaximo) {
      let carrito = JSON.parse(localStorage.getItem("carrito_restaurante") || "[]");
      const existente = carrito.find(i => i.producto_id === id);

      if (existente) {
        if (existente.cantidad >= stockMaximo) {
          mostrarToast(`Has alcanzado el stock disponible (${stockMaximo}) para este plato.`, "warning");
          return;
        }
        existente.cantidad += 1;
      } else {
        carrito.push({
          producto_id: id,
          nombre_producto: nombre,
          precio_unitario: precio,
          cantidad: 1
        });
      }

      localStorage.setItem("carrito_restaurante", JSON.stringify(carrito));
      actualizarBarraFlotante();
      mostrarToast(`"${nombre}" agregado a la orden`, "success");
    }

    function actualizarBarraFlotante() {
      const carrito = JSON.parse(localStorage.getItem("carrito_restaurante") || "[]");
      const totalItems = carrito.reduce((sum, i) => sum + i.cantidad, 0);
      const totalMonto = carrito.reduce((sum, i) => sum + (i.cantidad * i.precio_unitario), 0);

      const navCounter = document.getElementById("cart-counter");
      if (navCounter) navCounter.textContent = totalItems;

      const bar = document.getElementById("floating-cart-bar");
      if (totalItems > 0) {
        bar.classList.remove("d-none");
        bar.classList.add("d-flex");
        document.getElementById("floating-cart-items").textContent = `${totalItems} platillo${totalItems > 1 ? 's' : ''}`;
        document.getElementById("floating-cart-total").textContent = `$${totalMonto.toFixed(2)}`;
      } else {
        bar.classList.add("d-none");
        bar.classList.remove("d-flex");
      }
    }
  </script>
</body>
</html>
