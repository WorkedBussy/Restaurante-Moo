<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Comanda | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-fire text-danger me-2"></i>Sabor <span>& Fuego</span>
      </a>
      <div class="ms-auto" id="navbar-usuario-slot"></div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="mb-4">
      <a href="mis-pedidos.html" class="text-decoration-none text-muted small">
        <i class="bi bi-arrow-left me-1"></i>Volver a Mis Pedidos
      </a>
      <h2 class="fw-bold mt-2" id="titulo-pedido">Cargando pedido...</h2>
    </div>

    <div class="row g-4" id="detalle-contenido-row">
      <!-- Columna Izquierda: Detalles del pedido -->
      <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
            <h5 class="fw-bold mb-0">Detalle de Platillos</h5>
            <button class="btn btn-outline-danger btn-sm" onclick="imprimirFacturaActual()">
              <i class="bi bi-file-earmark-pdf me-1"></i>Factura Electrónica
            </button>
          </div>

          <div class="table-responsive mb-4">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Platillo</th>
                  <th class="text-center">Cant.</th>
                  <th class="text-end">Precio</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody id="pedido-items-tbody"></tbody>
            </table>
          </div>

          <div class="p-3 bg-light rounded-3">
            <div class="d-flex justify-content-between mb-1 small text-muted">
              <span>Subtotal:</span>
              <span id="txt-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-1 small text-muted">
              <span>I.V.A. (15%):</span>
              <span id="txt-iva">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-2 small text-muted">
              <span>Tarifa Servicio / Envío:</span>
              <span id="txt-envio">$0.00</span>
            </div>
            <hr class="my-2">
            <div class="d-flex justify-content-between fs-5 fw-bold">
              <span>Total Comanda:</span>
              <span class="text-danger" id="txt-total">$0.00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Línea de Tiempo de Estados (Patrón State & Auditoría) -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <h5 class="fw-bold mb-3 border-bottom pb-2">
            <i class="bi bi-activity text-danger me-2"></i>Estado en Vivo
          </h5>

          <div class="p-3 mb-4 rounded-3 text-center" id="estado-caja-actual">
            <span class="badge-estado" id="badge-estado-actual">...</span>
            <div class="mt-2 text-muted small" id="tiempo-estimado-txt"></div>
          </div>

          <h6 class="fw-bold text-muted small text-uppercase mb-3">Línea de Tiempo (Historial Append-Only)</h6>
          <div id="timeline-container">
            <!-- Pasos del historial -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/facturacion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    protegerPagina(["cliente", "administrador", "mesero", "repartidor"]);

    let pedidoActual = null;

    function iniciarPagina(datosUsuario, user) {
      const urlParams = new URLSearchParams(window.location.search);
      const pedidoId = urlParams.get("id");

      if (!pedidoId) {
        mostrarToast("No se especificó ningún pedido.", "error");
        setTimeout(() => navegarA("mis-pedidos.html"), 1000);
        return;
      }

      // Escucha en tiempo real de cambios en el estado del pedido
      db.collection("pedidos").doc(pedidoId).onSnapshot(doc => {
        if (!doc.exists) {
          mostrarToast("El pedido no existe.", "error");
          return;
        }
        pedidoActual = { id: doc.id, ...doc.data() };
        renderizarDetalle(pedidoActual);
      }, err => {
        console.error("Error al escuchar cambios del pedido:", err);
      });
    }

    function renderizarDetalle(p) {
      document.getElementById("titulo-pedido").textContent = `Comanda #${p.id.slice(0, 8).toUpperCase()}`;

      // Renderizar platillos
      const tbody = document.getElementById("pedido-items-tbody");
      tbody.innerHTML = (p.detalles || []).map(d => `
        <tr>
          <td><span class="fw-semibold text-dark">${d.nombre_producto}</span></td>
          <td class="text-center fw-bold">${d.cantidad}</td>
          <td class="text-end text-muted">$${d.precio_unitario.toFixed(2)}</td>
          <td class="text-end fw-bold text-dark">$${d.subtotal.toFixed(2)}</td>
        </tr>
      `).join("");

      // Totales
      document.getElementById("txt-subtotal").textContent = `$${p.subtotal.toFixed(2)}`;
      document.getElementById("txt-iva").textContent = `$${p.iva_monto.toFixed(2)}`;
      document.getElementById("txt-envio").textContent = `$${p.tarifa_envio.toFixed(2)}`;
      document.getElementById("txt-total").textContent = `$${p.total.toFixed(2)}`;

      // Estado actual
      const badge = document.getElementById("badge-estado-actual");
      badge.className = `badge-estado badge-${p.estado}`;
      badge.textContent = p.estado.replace(/_/g, " ");

      const box = document.getElementById("estado-caja-actual");
      box.className = `p-3 mb-4 rounded-3 text-center bg-${p.estado === 'entregado' ? 'success' : p.estado === 'cancelado' ? 'danger' : 'light'}-subtle`;

      const tiempoEl = document.getElementById("tiempo-estimado-txt");
      if (p.tiempo_estimado) {
        tiempoEl.innerHTML = `<i class="bi bi-clock-history me-1 text-danger"></i>Tiempo estimado de espera: <strong>~${p.tiempo_estimado} minutos</strong>`;
      } else {
        tiempoEl.textContent = "";
      }

      // Línea de tiempo append-only
      const tl = document.getElementById("timeline-container");
      tl.innerHTML = (p.historial || []).map(h => {
        const fecha = new Date(h.fecha).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="timeline-step">
            <span class="fw-bold text-dark text-capitalize">${h.estado_nuevo.replace(/_/g, " ")}</span>
            <small class="text-muted d-block">${fecha} - ${h.nota || 'Actualización registrada'}</small>
          </div>
        `;
      }).join("");
    }

    function imprimirFacturaActual() {
      if (pedidoActual) {
        ModuloFacturacion.imprimirFacturaHTML(pedidoActual);
      }
    }
  </script>
</body>
</html>
