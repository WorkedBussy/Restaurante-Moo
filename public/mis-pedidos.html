<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos & Facturas | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-fire text-danger me-2"></i>Sabor <span>& Fuego</span>
      </a>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="catalogo.html">Menú & Carta</a></li>
          <li class="nav-item"><a class="nav-link active" href="mis-pedidos.html">Mis Pedidos</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3" id="navbar-usuario-slot"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-clock-history text-danger me-2"></i>Historial de Comandas & Facturas</h2>
        <p class="text-muted small mb-0">Monitorea el estado en vivo de tus pedidos y descarga tus comprobantes electrónicos autorizados.</p>
      </div>
      <a href="catalogo.html" class="btn btn-outline-danger btn-sm"><i class="bi bi-plus-lg me-1"></i>Hacer Nuevo Pedido</a>
    </div>

    <!-- CONTENEDOR DE PEDIDOS -->
    <div class="row g-4" id="pedidos-cliente-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-danger" role="status"></div>
        <p class="text-muted mt-2">Cargando tus pedidos...</p>
      </div>
    </div>
  </main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/facturacion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    protegerPagina(["cliente", "administrador", "mesero", "repartidor"]);

    let listaPedidos = [];

    async function iniciarPagina(datosUsuario, user) {
      await cargarMisPedidos(user.uid);
    }

    async function cargarMisPedidos(uid) {
      const container = document.getElementById("pedidos-cliente-container");
      try {
        listaPedidos = await listarPedidosUsuario(uid);

        if (listaPedidos.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5 bg-white rounded-3 shadow-sm border p-5">
              <i class="bi bi-journal-x text-muted" style="font-size: 3.5rem;"></i>
              <h4 class="fw-bold mt-3">Aún no tienes pedidos registrados</h4>
              <p class="text-muted col-md-6 mx-auto mb-4">¡Anímate a probar nuestros mejores platillos!</p>
              <a href="catalogo.html" class="btn btn-primary-custom">Ir a la Carta</a>
            </div>
          `;
          return;
        }

        container.innerHTML = listaPedidos.map(p => {
          const fechaStr = p.created_at?.toDate ? p.created_at.toDate().toLocaleString() : new Date().toLocaleString();
          const itemsTxt = (p.detalles || []).map(d => `${d.cantidad}x ${d.nombre_producto}`).join(", ");
          
          return `
            <div class="col-12">
              <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white py-3 px-4 d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom">
                  <div>
                    <span class="fw-bold text-dark me-2">Pedido #${p.id.slice(0, 8).toUpperCase()}</span>
                    <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i>${fechaStr}</span>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <span class="badge-estado badge-${p.estado}">${p.estado.replace(/_/g, " ")}</span>
                    ${p.tiempo_estimado ? `<span class="badge bg-dark"><i class="bi bi-stopwatch me-1"></i>~${p.tiempo_estimado} min</span>` : ''}
                  </div>
                </div>

                <div class="card-body px-4 py-3">
                  <div class="row align-items-center g-3">
                    <div class="col-md-5">
                      <p class="mb-1 text-muted small fw-semibold">Platillos Ordenados:</p>
                      <p class="mb-0 fw-medium text-dark">${itemsTxt}</p>
                    </div>
                    <div class="col-md-3">
                      <p class="mb-1 text-muted small fw-semibold">Servicio & Destino:</p>
                      <p class="mb-0 fw-medium text-dark">
                        <span class="badge bg-light text-dark border me-1 text-capitalize">${p.tipo_servicio}</span>
                        ${p.mesa_o_direccion}
                      </p>
                    </div>
                    <div class="col-md-2">
                      <p class="mb-1 text-muted small fw-semibold">Total Cancelado:</p>
                      <h5 class="mb-0 fw-bold text-danger">$${p.total.toFixed(2)}</h5>
                    </div>
                    <div class="col-md-2 text-md-end">
                      <button class="btn btn-outline-dark btn-sm w-100 mb-2" onclick="descargarFactura('${p.id}')">
                        <i class="bi bi-file-earmark-pdf text-danger me-1"></i>Factura PDF
                      </button>
                      <a href="pedido-detalle.html?id=${p.id}" class="btn btn-primary-custom btn-sm w-100">
                        <i class="bi bi-eye me-1"></i>Seguimiento
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        console.error("Error al cargar pedidos del usuario:", err);
      }
    }

    function descargarFactura(pedidoId) {
      const pedido = listaPedidos.find(p => p.id === pedidoId);
      if (pedido) {
        ModuloFacturacion.imprimirFacturaHTML(pedido);
      } else {
        mostrarToast("No se encontró la información de la factura", "error");
      }
    }
  </script>
</body>
</html>
