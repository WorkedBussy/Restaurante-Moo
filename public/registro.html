<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none text-dark d-inline-block">
            <h2 class="fw-bolder mb-1"><i class="bi bi-fire text-danger me-2"></i>Sabor & Fuego</h2>
          </a>
          <p class="text-muted small">Regístrate para realizar pedidos y gestionar tus comprobantes electrónicos</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <h4 class="fw-bold mb-4">Registro de Cliente</h4>

            <form id="form-registro" onsubmit="handleRegistro(event)">
              <div class="mb-3">
                <label for="reg-nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="reg-nombre" placeholder="Ej. Juan Pérez" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="reg-id" class="form-label fw-semibold">Cédula o RUC (Facturación)</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-card-heading"></i></span>
                    <input type="text" class="form-control" id="reg-id" placeholder="1312345678" required>
                  </div>
                </div>
                <div class="col-md-6">
                  <label for="reg-telefono" class="form-label fw-semibold">Teléfono Celular</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="reg-telefono" placeholder="0991234567" required>
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label for="reg-email" class="form-label fw-semibold">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="reg-email" placeholder="juan.perez@ejemplo.com" required>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="reg-pass" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" class="form-control" id="reg-pass" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>
                <div class="col-md-6">
                  <label for="reg-pass-confirm" class="form-label fw-semibold">Confirmar Contraseña</label>
                  <input type="password" class="form-control" id="reg-pass-confirm" placeholder="Repite tu contraseña" minlength="6" required>
                </div>
              </div>

              <button type="submit" id="btn-registrar" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                <i class="bi bi-person-check me-2"></i>Crear Cuenta
              </button>
            </form>

            <div class="text-center pt-3 border-top">
              <span class="text-muted small">¿Ya tienes una cuenta?</span>
              <a href="login.html" class="fw-bold text-danger text-decoration-none ms-1">Inicia sesión</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    async function handleRegistro(e) {
      e.preventDefault();
      const nombre = document.getElementById("reg-nombre").value;
      const iden = document.getElementById("reg-id").value;
      const telf = document.getElementById("reg-telefono").value;
      const email = document.getElementById("reg-email").value;
      const pass = document.getElementById("reg-pass").value;
      const passConf = document.getElementById("reg-pass-confirm").value;
      const btn = document.getElementById("btn-registrar");

      if (pass !== passConf) {
        mostrarToast("Las contraseñas no coinciden.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

      try {
        await registrarUsuario(nombre, email, pass, telf, iden);
        setTimeout(() => {
          window.location.href = "/catalogo.html";
        }, 800);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-check me-2"></i>Crear Cuenta';
      }
    }
  </script>
</body>
</html>
