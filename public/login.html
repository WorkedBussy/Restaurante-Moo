<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Sabor & Fuego</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none text-dark d-inline-block">
            <h2 class="fw-bolder mb-1"><i class="bi bi-fire text-danger me-2"></i>Sabor & Fuego</h2>
          </a>
          <p class="text-muted small">Ingresa a tu cuenta para ordenar o gestionar tu restaurante</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <h4 class="fw-bold mb-4">Iniciar Sesión</h4>

            <form id="form-login" onsubmit="handleLogin(event)">
              <div class="mb-3">
                <label for="login-email" class="form-label fw-semibold">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="login-email" placeholder="tu.correo@ejemplo.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="login-password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" id="btn-login" class="btn btn-primary-custom w-100 py-2 fs-6 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Acceder al Sistema
              </button>
            </form>

            <div class="text-center pt-3 border-top">
              <span class="text-muted small">¿No tienes una cuenta aún?</span>
              <a href="registro.html" class="fw-bold text-danger text-decoration-none ms-1">Regístrate aquí</a>
            </div>
          </div>
        </div>

        <!-- NOTA PEDAGÓGICA Y SEGURIDAD -->
        <div class="mt-4 p-3 bg-white rounded-3 border text-center shadow-sm">
          <small class="text-muted d-block">
            <i class="bi bi-info-circle text-primary me-1"></i>
            <strong>Acceso Administrativo Oculto:</strong> Presiona <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd> con sesión de Administrador para abrir el panel.
          </small>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Capas del Proyecto -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Si ya hay sesión activa, redirigir
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        const doc = await db.collection("usuarios").doc(user.uid).get();
        const rol = doc.exists ? doc.data().rol : "cliente";
        redirigirPorRol(rol);
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-password").value;
      const btn = document.getElementById("btn-login");

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';

      try {
        const resultado = await iniciarSesion(email, pass);
        redirigirPorRol(resultado.rol);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Acceder al Sistema';
      }
    }

    function redirigirPorRol(rol) {
      if (rol === "administrador") {
        navegarA("admin/dashboard.html");
      } else if (rol === "mesero" || rol === "repartidor") {
        navegarA("repartidor/entregas.html");
      } else {
        navegarA("catalogo.html");
      }
    }
  </script>
</body>
</html>
